name: Feature request
description: Propose a schema field, rule, or CLI capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the current contract format or CLI cannot express.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would add, and how it would be validated.
    validations:
      required: true
