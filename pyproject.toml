[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-studio"
version = "0.1.0"
description = "Agent role contracts (markdown) with Builder-Verifier separation, a validator and an enforcement engine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agency-studio = "agency_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
