[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-studio"
version = "0.2.0"
description = "Agent role contracts (markdown) with Builder-Verifier separation, a validator and an enforcement engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mike Rodgers" }]
keywords = ["agents", "roles", "contracts", "builder-verifier", "validation", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/agency-studio"
Repository = "https://github.com/mrodgersjs-web/agency-studio"
Issues = "https://github.com/mrodgersjs-web/agency-studio/issues"

[project.scripts]
agency-studio = "agency_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agency_studio = ["py.typed"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
