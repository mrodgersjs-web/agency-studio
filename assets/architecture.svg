<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Agency Studio architecture">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0D0A07"/>
    <stop offset="55%" stop-color="#0A0806"/>
    <stop offset="100%" stop-color="#0B0705"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8A7148"/>
    <stop offset="50%" stop-color="#C8A96E"/>
    <stop offset="100%" stop-color="#E8CD98"/>
  </linearGradient>
  <linearGradient id="goldGradSoft" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.15"/>
    <stop offset="50%" stop-color="#C8A96E" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#C8A96E" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="panelFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#181109"/>
    <stop offset="100%" stop-color="#0E0A06"/>
  </linearGradient>
  <linearGradient id="panelFillLit" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#211708"/>
    <stop offset="100%" stop-color="#120C07"/>
  </linearGradient>
  <linearGradient id="panelFillRust" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#20130F"/>
    <stop offset="100%" stop-color="#140B08"/>
  </linearGradient>
  <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowGoldFaint" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowCream" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F5F0EB" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#F5F0EB" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowRust" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#9A5A48" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#9A5A48" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowSage" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7C9482" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#7C9482" stop-opacity="0"/>
  </radialGradient>
  <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <filter id="fineGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C8A96E"/>
  </marker>
  <marker id="arrowStone" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#A09890"/>
  </marker>
  <marker id="arrowRust" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9A5A48"/>
  </marker>
  <marker id="arrowSage" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7C9482"/>
  </marker>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#F5F0EB" stroke-opacity="0.028" stroke-width="1"/>
  </pattern>
</defs>

  <rect x="0" y="0" width="1200" height="400" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="400" fill="url(#grid)"/>
  
  <circle cx="230" cy="230" r="180" fill="url(#glowGoldFaint)"/>
  <circle cx="970" cy="230" r="180" fill="url(#glowCream)"/>

  <rect x="0.5" y="0.5" width="1199" height="399" fill="none" stroke="#C8A96E" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="40" y1="368" x2="1160" y2="368" stroke="url(#goldGradSoft)" stroke-width="1"/>

  <text x="44" y="24" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2" fill="#C8A96E">SEPARATION OF AUTHORITY</text>
  <text x="44" y="56" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-style="italic" font-size="30" fill="#F5F0EB">Agency Studio</text>
  <text x="1156" y="40" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" letter-spacing="0.5" fill="#A09890">builder.verify()</text>
  <line x1="44" y1="70" x2="108" y2="70" stroke="#C8A96E" stroke-width="1.5"/>

  <g>
    <rect x="66" y="130" width="400" height="210" rx="22" fill="url(#glowGold)" filter="url(#softBlur)" opacity="0.5"/>
    <rect x="76" y="140" width="380" height="190" rx="14" fill="url(#panelFillLit)" stroke="#C8A96E" stroke-opacity="0.38" stroke-width="1.1"/>
    <rect x="76" y="140" width="380" height="2" rx="1" fill="#C8A96E" opacity="0.55"/>
    <text x="266.0" y="229.0" text-anchor="middle" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" letter-spacing="0.3" fill="#F5F0EB">BUILDER</text>
    <text x="266.0" y="253.0" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">writes / edits / proposes</text>
  </g><g transform="translate(266.0,192) scale(1.15)" stroke="#E8CD98" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7,-9 L-16,0 L-7,9"/>
    <path d="M7,-9 L16,0 L7,9"/>
    <path d="M2,-11 L-2,11" stroke-width="1.6" opacity="0.85"/>
  </g><text x="266.0" y="312" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">agent · full tool access</text>
  <g>
    <rect x="734" y="130" width="400" height="210" rx="22" fill="url(#glowGold)" filter="url(#softBlur)" opacity="0.5"/>
    <rect x="744" y="140" width="380" height="190" rx="14" fill="url(#panelFillLit)" stroke="#C8A96E" stroke-opacity="0.38" stroke-width="1.1"/>
    <rect x="744" y="140" width="380" height="2" rx="1" fill="#C8A96E" opacity="0.55"/>
    <text x="934.0" y="229.0" text-anchor="middle" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" letter-spacing="0.3" fill="#F5F0EB">VERIFIER</text>
    <text x="934.0" y="253.0" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">inspects / tests / decides</text>
  </g><g transform="translate(934.0,190) scale(1.25)"><path d="M0,-15 L13,-9 L13,4 C13,12 6,17 0,20 C-6,17 -13,12 -13,4 L-13,-9 Z" fill="none" stroke="#F5F0EB" stroke-width="2.1" stroke-linejoin="round"/><path d="M-5.5,0 L-1.5,5 L6.5,-6" fill="none" stroke="#F5F0EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="934.0" y="312" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">independent · read + test only</text><circle cx="600" cy="235" r="58" fill="url(#glowGold)" filter="url(#softBlur)" opacity="0.7"/><polygon points="643.3,210.0 643.3,260.0 600.0,285.0 556.7,260.0 556.7,210.0 600.0,185.0" fill="url(#panelFillLit)" stroke="#C8A96E" stroke-width="2"/><g transform="translate(600,229) scale(1.15)">
    <rect x="-9" y="-2" width="18" height="15" rx="2.5" fill="none" stroke="#E8CD98" stroke-width="2"/>
    <path d="M-6,-2 L-6,-8 C-6,-13 6,-13 6,-8 L6,-2" fill="none" stroke="#E8CD98" stroke-width="2"/>
    <circle cx="0" cy="5" r="1.8" fill="#E8CD98"/>
  </g><text x="600" y="265" text-anchor="middle" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="0.4" fill="#C8A96E">GATE</text><path d="M456,235.0 C495.2,235.0 514.8,221 554,221" fill="none" stroke="#C8A96E" stroke-width="2"  opacity="1" marker-end="url(#arrowGold)" stroke-linecap="round"/><path d="M646,221 C685.2,221 704.8,235.0 744,235.0" fill="none" stroke="#C8A96E" stroke-width="2"  opacity="1" marker-end="url(#arrowGold)" stroke-linecap="round"/><path d="M784,336 C 584,388 616,388 116,336" fill="none" stroke="#A09890" stroke-width="1.4" stroke-dasharray="2,5" marker-end="url(#arrowStone)" opacity="0.75"/><text x="600" y="376" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" letter-spacing="0.4" fill="#A09890">reject → revise</text><text x="600" y="112" text-anchor="middle" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-style="italic" font-size="17" fill="#E8CD98">Builder ≠ Verifier</text><text x="44" y="386" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="0.8" fill="#A09890">no agent grades its own work</text><text x="1156" y="386" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">SEPARATION OF DUTIES</text></svg>